    96ELN3-4.0:forge-dsp-V40-96ELN-3-bascom-1.11.6000.hex
    96ELN3-4.1:forge-dsp-V41-96ELN-3-bascom-1.11.6000.hex
custom_expect_device = 96ELN3-4.0,96ELN3-4.1

[env:V4x-96ELN-3-bringup]
build_flags = ${common.build_flags} ${common.bringup_options} -Isrc/flavours/V40-96ELN-3
build_src_filter = +<*> -<flavours/> +<flavours/V40-96ELN-3/>
custom_release_assets =
    96ELN3-4.0:forge-dsp-V40-96ELN-3-bascom-1.11.6000.hex
    96ELN3-4.1:forge-dsp-V41-96ELN-3-bascom-1.11.6000.hex
custom_expect_device = 96ELN3-4.0,96ELN3-4.1
