; Forge DSP: eigene Firmware in C (Port der BASCOM-Firmware 1.11.6000), alle Varianten.
; Flashen über den Bootloader chip45boot3 mit tools/c45b3-host (siehe README.md).
; Umgebung = Variante (PCB-Ordner + Modell), der Name wählt src/flavours/<name>. Vor dem Flashen fragt der Upload per
; <system.key.info Modell und PCB-Version des angeschlossenen Forge ab und bricht ab,
; wenn sie nicht zur Umgebung passen. V30-96ELN meldet "4.0" wie V40-96ELN (Quelltext).

[platformio]
default_envs = V41-96ELN-3

[forge]
c45b3_dir = tools/c45b3-host
; Befehl, mit dem die eigene Firmware in den Bootloader springt; die Originalfirmware
; kennt ihn nicht, dann Forge während des Wartens aus- und einschalten
enter_cmd = >system.bootloader=1
wait_seconds = 30
backup_dir = backups
; offizielle Firmware 1.11.6000 als Rückweg: GitHub-Release, sha256 gepinnt
release_url = https://github.com/psych0d0g/forge-dsp-firmware/releases/download/0.0.1116000
release_sums = scripts/release-0.0.1116000.sha256

[common]
build_flags =
    -std=gnu11
    -Wall -Wextra
    -ffunction-sections -fdata-sections
    -Wl,--gc-sections
    -Iinclude

[env]
platform = atmelavr@~5.3.0
board = forge_xmega256a3u
; Zielport: CP2102 des Forge (X105), am besten fest per by-id, z. B.
; upload_port = /dev/serial/by-id/usb-Silicon_Labs_CP2102_USB_to_UART_Bridge_Controller_XXXX-if00-port0
upload_protocol = custom
monitor_speed = 38400
monitor_eol = CRLF
monitor_filters = send_on_enter
extra_scripts =
    pre:scripts/version.py
    post:scripts/c45b3_pio.py
    post:scripts/dist.py

[env:V30-96ELN]
build_flags = ${common.build_flags} -Isrc/flavours/V30-96ELN
build_src_filter = +<*> -<flavours/> +<flavours/V30-96ELN/>
custom_release_asset = forge-dsp-V30-96ELN-bascom-1.11.6000.hex
custom_expect_device = 96ELN-4.0

[env:V30-96LN]
build_flags = ${common.build_flags} -Isrc/flavours/V30-96LN
build_src_filter = +<*> -<flavours/> +<flavours/V30-96LN/>
custom_release_asset = forge-dsp-V30-96LN-bascom-1.11.6000.hex
custom_expect_device = 96LN-3.0

[env:V40-96ELN-3]
build_flags = ${common.build_flags} -Isrc/flavours/V40-96ELN-3
build_src_filter = +<*> -<flavours/> +<flavours/V40-96ELN-3/>
custom_release_asset = forge-dsp-V40-96ELN-3-bascom-1.11.6000.hex
custom_expect_device = 96ELN3-4.0

[env:V40-96ELN]
build_flags = ${common.build_flags} -Isrc/flavours/V40-96ELN
build_src_filter = +<*> -<flavours/> +<flavours/V40-96ELN/>
custom_release_asset = forge-dsp-V40-96ELN-bascom-1.11.6000.hex
custom_expect_device = 96ELN-4.0

[env:V40-CORED8]
build_flags = ${common.build_flags} -Isrc/flavours/V40-CORED8
build_src_filter = +<*> -<flavours/> +<flavours/V40-CORED8/>
custom_release_asset = forge-dsp-V40-CORED8-bascom-1.11.6000.hex
custom_expect_device = CORED8-4.0

[env:V41-96ELN-3]
build_flags = ${common.build_flags} -Isrc/flavours/V41-96ELN-3
