; Forge DSP: eigene Firmware in C (Port der BASCOM-Firmware 1.11.6000), alle Varianten.
; Flashen über den Bootloader chip45boot3 mit tools/c45b3-host (siehe README.md).
; Umgebung = Variante (PCB-Ordner + Modell), der Name wählt src/flavours/<name>. Vor dem Flashen fragt der Upload per
; get.1 system.key.info Modell und PCB-Version des angeschlossenen Forge ab und bricht ab,
; wenn sie nicht zur Umgebung passen. V30-96ELN meldet "4.0" wie V40-96ELN (Quelltext).

[platformio]
default_envs = V4x-96ELN-3

[forge]
c45b3_dir = tools/c45b3-host
; Software-Reset in den Bootloader (Original: cmd_set_system_boot, ohne Werkseinstellungen;
; Reset ~1 s nach der Antwort). Antwortet der Forge nicht, während des Wartens aus-/einschalten.
; enter_cmd = set.1 system.boot=1   (the bootloader only answers after the key, see README)
wait_seconds = 60
; Baudrate der laufenden Firmware am USB-COM (Original und Port: 38400, nicht per Protokoll änderbar)
app_baud = 38400
backup_dir = backups
; offizielle Firmware 1.11.6000 als Rückweg: GitHub-Release, sha256 gepinnt
release_url = https://github.com/psych0d0g/forge-dsp-firmware/releases/download/0.0.1116000
release_sums = scripts/release-0.0.1116000.sha256

[common]
; Build options (docs/port-changes.md):
; FORGE_BRINGUP=1: full start of the original (DAC, DSPs, S/PDIF, preset, MODC, events, IR,
;   microSD). 0 = safe variant: detection and protocol only, peripherals in reset, no sound.
; FORGE_AUDIO=1: the preset load switches remote out (amplifiers) on, as the original does.
;   Only after the bring-up has been checked on a device, first test with a quiet load.
; FORGE_FACTORY_RESET=1 (needs FORGE_BRINGUP=1): factory reset of the original after a
;   blank/foreign EEPROM, a version change or system.reinit: deletes all tuning and presets.
; The environments <name> build the safe variant, <name>-bringup the full start.
safe_options =
    -DFORGE_BRINGUP=0
    -DFORGE_AUDIO=0
    -DFORGE_FACTORY_RESET=0
bringup_options =
    -DFORGE_BRINGUP=1
    -DFORGE_AUDIO=0
    -DFORGE_FACTORY_RESET=0
build_flags =
    -mdouble=64
    -mlong-double=64
    -std=gnu17
    -Wall -Wextra
    -ffunction-sections -fdata-sections
    -Wl,--gc-sections
    -Iinclude

[env]
platform = atmelavr@~5.3.0
; avr-gcc 16.2.1 + lower-subreg fix with 64-bit double (BASCOM computes biquads in double); once per machine:
;   tools/get-toolchain.sh
platform_packages = toolchain-atmelavr@symlink://${PROJECT_DIR}/.toolchain/avr-gcc
board = forge_xmega256a3u
; Zielport: CP2102 des Forge (X105), am besten fest per by-id, z. B.
; upload_port = /dev/serial/by-id/usb-Silicon_Labs_CP2102_USB_to_UART_Bridge_Controller_XXXX-if00-port0
upload_protocol = custom
monitor_speed = 38400
monitor_eol = CRLF
monitor_filters = send_on_enter
extra_scripts =
    pre:scripts/version.py
    pre:scripts/linkflags.py
    post:scripts/check_math.py
    post:scripts/c45b3_pio.py
    post:scripts/dist.py

[env:V30-96ELN]
build_flags = ${common.build_flags} ${common.safe_options} -Isrc/flavours/V30-96ELN
build_src_filter = +<*> -<flavours/> +<flavours/V30-96ELN/>
custom_release_assets = 96ELN-4.0:forge-dsp-V30-96ELN-bascom-1.11.6000.hex
custom_expect_device = 96ELN-4.0

[env:V30-96ELN-bringup]
build_flags = ${common.build_flags} ${common.bringup_options} -Isrc/flavours/V30-96ELN
build_src_filter = +<*> -<flavours/> +<flavours/V30-96ELN/>
custom_release_assets = 96ELN-4.0:forge-dsp-V30-96ELN-bascom-1.11.6000.hex
custom_expect_device = 96ELN-4.0

[env:V30-96LN]
build_flags = ${common.build_flags} ${common.safe_options} -Isrc/flavours/V30-96LN
build_src_filter = +<*> -<flavours/> +<flavours/V30-96LN/>
custom_release_assets = 96LN-3.0:forge-dsp-V30-96LN-bascom-1.11.6000.hex
custom_expect_device = 96LN-3.0

[env:V30-96LN-bringup]
build_flags = ${common.build_flags} ${common.bringup_options} -Isrc/flavours/V30-96LN
build_src_filter = +<*> -<flavours/> +<flavours/V30-96LN/>
custom_release_assets = 96LN-3.0:forge-dsp-V30-96LN-bascom-1.11.6000.hex
custom_expect_device = 96LN-3.0

; V40/V41 Forge DSP 96ELN and ETON CORE D8: identical firmware, only the identity differs (#31)
[env:V4x-96ELN]
build_flags = ${common.build_flags} ${common.safe_options} -Isrc/flavours/V40-96ELN
build_src_filter = +<*> -<flavours/> +<flavours/V40-96ELN/>
custom_release_assets =
    96ELN-4.0:forge-dsp-V40-96ELN-bascom-1.11.6000.hex
    CORED8-4.0:forge-dsp-V40-CORED8-bascom-1.11.6000.hex
    CORED8-4.1:forge-dsp-V41-CORED8-bascom-1.11.6000.hex
custom_expect_device = 96ELN-4.0,CORED8-4.0,CORED8-4.1

[env:V4x-96ELN-bringup]
build_flags = ${common.build_flags} ${common.bringup_options} -Isrc/flavours/V40-96ELN
build_src_filter = +<*> -<flavours/> +<flavours/V40-96ELN/>
custom_release_assets =
    96ELN-4.0:forge-dsp-V40-96ELN-bascom-1.11.6000.hex
    CORED8-4.0:forge-dsp-V40-CORED8-bascom-1.11.6000.hex
    CORED8-4.1:forge-dsp-V41-CORED8-bascom-1.11.6000.hex
custom_expect_device = 96ELN-4.0,CORED8-4.0,CORED8-4.1

; V40/V41 Forge DSP 96ELN-3: identical firmware, only the PCB version differs (#31)
[env:V4x-96ELN-3]
build_flags = ${common.build_flags} ${common.safe_options} -Isrc/flavours/V40-96ELN-3
build_src_filter = +<*> -<flavours/> +<flavours/V40-96ELN-3/>
